<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNPJ</title>
    <link rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🚨</text></svg>'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <base target="_blank">
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">
            <i class="fas fa-building"></i>
            <span>Consulta CNPJ</span>
        </div>
        <span class="badge">BrasilAPI</span>
    </div>
</header>

<main>
    <div class="search-box">
        <label for="cnpj-input">Digite o CNPJ</label>
        <div class="input-row">
            <input type="text" id="cnpj-input" maxlength="18" placeholder="00.000.000/0000-00" autocomplete="off">
            <button id="search-btn">
                <i class="fas fa-search"></i> Consultar
            </button>
        </div>
        <p class="hint">Apenas números ou com máscara. Ex: 11.222.333/0001-81</p>
    </div>

    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <span>Buscando dados na Receita Federal…</span>
    </div>

    <div id="error-container" class="hidden"></div>

    <div id="results-container" class="hidden">
        <!-- Resultados injetados via ..JS -->
    </div>
</main>

<footer>
    <p>Desenvolvido por <a href="https://linkedin.com/in/bfs-bruno" target="_blank">Bruno Ferreira Salustiano</a></p>
    <p class="copy">Dados via BrasilAPI · Receita Federal do Brasil</p>
</footer>

<!-- PDF Generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
